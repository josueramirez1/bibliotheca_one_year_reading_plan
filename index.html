<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/852a4f6fd4.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Bibliotheca Reading Plan</title>
  </head>
  <body>
    <div class="container">
      <header>
        <i class="fa-solid fa-paragraph"></i>
        <h1>Bibliotheca</h1>
        <h2>365-Day Reading Plan (Main Track & Dual-Cycle Psalms)</h2>
      </header>

      <div id="reading-plan" class="plan-grid">
        <div class="row header-row">
          <div class="cell header-cell">Day</div>
          <div class="cell header-cell vol-header">Volume</div>
          <div class="cell header-cell page-header">Main Pages</div>
          <div class="cell header-cell psalm-header">Psalms (Vol. III)</div>
        </div>
      </div>

      <footer></footer>
    </div>
  </body>
</html>
